name: EurSuRA-kb
description: European Sustainability Reporting and Assessment Knowledge Base
framework_path: ../kb-framework
default_source_body: EFRAG
mkdocs_config: mkdocs.yml

# Per-task enrichment backend. All tasks run locally on Ollama (free) — no Claude
# calls. `ollama` (8k ctx) handles the per-source ingest tasks; `ollama-xl` (32k
# ctx) handles the whole-corpus generators (model/synthesis), the merge step, and
# the deep linter, whose prompts exceed 8k. A KB with no `enrich:` block defaults
# to all-Claude, so this is opt-in. Flip any task back to `claude` for quality.
enrich:
  backends:
    claude:    { model: claude-sonnet-4-6 }
    ollama:    { model: qwen3:8b, host: http://localhost:11434, num_ctx: 8192,  temperature: 0.1, timeout: 1200 }
    ollama-xl: { model: qwen3:8b, host: http://localhost:11434, num_ctx: 32768, temperature: 0.1, timeout: 1800 }
  tasks:
    tagger:    ollama
    rewrite:   ollama       # viable on good input; readability guard blocks garbage upfront (#14)
    merge:     ollama-xl    # moved off Claude per request — quality risk on merge-not-overwrite
    glossary:  ollama
    model:     ollama-xl    # semantic-model / concept-map / ontology (query.py)
    synthesis: ollama-xl    # cross-domain insight pages (query.py)
    lint:      ollama-xl    # deep contradiction check (lint.py --deep)

lint:
  hard_fail: [ORPHAN, STALE]      # kinds that fail CI; XREF and CONTRADICTION are advisory
  ignore_terms:                   # glossary terms too common to require wikilinking
    - sustainability
    - climate change

# Domain tag -> canonical page. Used by ingest (Layer-1 merge) and bootstrap (splitter
# routing). Tags are matched case-insensitively against frontmatter `domain` values.
domains:
  ESRS: standards/esrs/index.md
  CSRD: standards/csrd/index.md
  EU-TAXONOMY: standards/eu-taxonomy/index.md
  VSME: standards/vsme/index.md
  GHG: standards/ghg-protocol/index.md
  GRI: frameworks/gri/index.md
  TCFD: frameworks/tcfd/index.md
  SDG: frameworks/un-sdgs/index.md
