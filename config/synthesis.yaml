# Cross-domain synthesis pages (Layer 3).
#
# Each entry declares one LLM-composed page that COMBINES the listed source
# domains around a theme. Pages are generated by:
#
#     python ../kb-framework/pipeline/query.py --kb . --synthesis
#
# and are regenerated automatically on every ingest. They are DERIVED artefacts
# (frontmatter `generated: true`) — never hand-edit them; edit the source domain
# pages or this config instead.
#
# `sources` are domain page slugs found under docs/standards/<slug>/index.md or
# docs/frameworks/<slug>/index.md.

- title: Climate Disclosure Across Frameworks
  theme: How an SME discloses climate-related information across the main EU and international regimes, and where they overlap.
  sources: [esrs, tcfd, ghg-protocol, eu-taxonomy]

- title: The SME Reporting Pathway
  theme: When VSME applies versus full ESRS/CSRD, and how the voluntary and mandatory regimes relate for a small or medium enterprise.
  sources: [vsme, esrs, csrd]

- title: Double Materiality Across Regimes
  theme: How the concept of double materiality is defined and operationalised across the CSRD/ESRS regime and the GRI framework.
  sources: [csrd, esrs, gri]
