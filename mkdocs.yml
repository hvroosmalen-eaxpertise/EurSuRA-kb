site_name: EurSuRA Knowledge Base
site_description: European Sustainability Reporting and Assessment
site_author: EAXpertise
site_url: https://hvroosmalen-eaxpertise.github.io/EurSuRA-kb/
docs_dir: docs
site_dir: site
repo_url: https://github.com/hvroosmalen-eaxpertise/EurSuRA-kb
repo_name: hvroosmalen-eaxpertise/EurSuRA-kb
edit_uri: edit/master/docs/
theme:
  name: material
  palette:
    primary: green
    accent: teal
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - content.action.edit
  - search.highlight
  - search.suggest
  - toc.follow
plugins:
- search
- git-revision-date-localized:
    type: datetime
    fallback_to_build_date: true
    enable_creation_date: false
hooks:
- hooks.py
extra_javascript:
- assets/javascripts/mermaid-toolbar.js
markdown_extensions:
- tables
- toc:
    permalink: true
- admonition
- footnotes
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ''
nav:
