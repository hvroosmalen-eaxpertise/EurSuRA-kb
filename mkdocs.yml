site_name: EurSuRA Knowledge Base
site_description: European Sustainability Reporting and Assessment
site_author: EAXpertise
site_url: https://hvroosmalen-eaxpertise.github.io/EurSuRA-kb/
docs_dir: docs
site_dir: site
repo_url: https://github.com/hvroosmalen-eaxpertise/EurSuRA-kb
repo_name: hvroosmalen-eaxpertise/EurSuRA-kb
edit_uri: edit/master/docs/
theme:
  name: material
  palette:
    primary: green
    accent: teal
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - content.action.edit
  - search.highlight
  - search.suggest
  - toc.follow
plugins:
- search
- git-revision-date-localized:
    type: datetime
    fallback_to_build_date: true
    enable_creation_date: false
hooks:
- hooks.py
extra_javascript:
- assets/javascripts/mermaid-toolbar.js
markdown_extensions:
- tables
- toc:
    permalink: true
- admonition
- footnotes
- pymdownx.superfences:
    custom_fences:
    - name: mermaid
      class: mermaid
      format: !!python/name:pymdownx.superfences.fence_code_format ''
nav:
- Home: index.md
- Standards:
  - ESRS: standards/esrs/index.md
  - CSRD: standards/csrd/index.md
  - EU Taxonomy: standards/eu-taxonomy/index.md
  - VSME: standards/vsme/index.md
  - GHG Protocol: standards/ghg-protocol/index.md
- Frameworks:
  - UN SDGs: frameworks/un-sdgs/index.md
  - GRI: frameworks/gri/index.md
  - TCFD: frameworks/tcfd/index.md
- Reports:
  - '2025': reports/2025/index.md
  - '2026':
    - Overview: reports/2026/index.md
    - Sustainability and ESG Reporting Frameworks: reports/2026/6-esg-reporting-frameworks.md
    - Due Diligence in Corporate Sustainability: reports/2026/due-diligence-in-6-stappen-nl-sep2021.md
    - ESG Business Handbook: reports/2026/esg-business-handbook.md
    - DigComp 3.0 - European Digital Competence Framework: reports/2026/jrc144121_01.md
    - Voluntary Sustainability Reporting for SMEs: reports/2026/webinar-vsme---marlou-duchateau-en-esther-roelofsen.md
    - Green Software Foundation  Sci For Ai Specification: reports/2026/green-software-foundation--sci-for-ai-specification.md
    - 'An Architecture For Sustainable Value Transition Within Social And Planetary Boundaries ': reports/2026/an-architecture-for-sustainable-value-transition-within-social-and-planetary-boundaries-.md
    - Csi   Green Software Foundation: reports/2026/csi---green-software-foundation.md
    - Oeso Richtlijnen+Nederlandse+Vertaling: reports/2026/oeso-richtlijnen+nederlandse+vertaling.md
    - Online Bijeenkomst Grip Op Eu Duurzaamheidswetgeving Deelversie: reports/2026/online-bijeenkomst-grip-op-eu-duurzaamheidswetgeving-deelversie.md
    - Q&A Nav Webinair Vsme_Marlou En Esther: reports/2026/q&a-nav-webinair-vsme_marlou-en-esther.md
    - Sci For Web Assembly Report: reports/2026/sci-for-web-assembly-report.md
    - Sdg Csrd Esrs Matrix: reports/2026/sdg-csrd-esrs-matrix.md
    - Vsme Standard Nl Onofficiële Vertaling Met Ai: reports/2026/vsme-standard-nl-onofficiële-vertaling-met-ai.md
    - 'Sustainability Management: A Systems Approach': reports/2026/_oceanofpdf.com_sustainability_management_-_ana_cristina_siqueira.md
    - EFRAG Assessment of a Voluntary SME Template at ESAP: reports/2026/efrag-final-assessment-report-web.md
    - Strategic Sustainability Communication: reports/2026/strategic-sustainability-communication.md
    - Strategic Management for Sustainability: reports/2026/strategic_management_for_sustainability.md
    - VSME Digital Template and XBRL Taxonomy: reports/2026/vsme-digital-template-and-xbrl-taxonomy-explanatory-note-june-2026.md
- Models:
  - Semantic Model: models/semantic-model.md
  - Concept Map: models/concept-map.md
  - Ontology: models/ontology.md
  - Cross-Reference Matrix: cross-reference-matrix.md
- Insights:
  - Overview: insights/index.md
  - Climate Disclosure Across Frameworks: insights/climate-disclosure-across-frameworks.md
