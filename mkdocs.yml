site_name: EurSuRA Knowledge Base
site_description: European Sustainability Reporting and Assessment
site_author: EAXpertise
docs_dir: docs
site_dir: site

theme:
  name: material
  palette:
    primary: green
    accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow

plugins:
  - search

hooks:
  - hooks.py

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - footnotes

nav:
  - Home: index.md
  - Standards:
    - ESRS: standards/esrs/index.md
    - CSRD: standards/csrd/index.md
    - EU Taxonomy: standards/eu-taxonomy/index.md
    - VSME: standards/vsme/index.md
    - GHG Protocol: standards/ghg-protocol/index.md
  - Frameworks:
    - UN SDGs: frameworks/un-sdgs/index.md
    - GRI: frameworks/gri/index.md
    - TCFD: frameworks/tcfd/index.md
  - Reports:
    - "2025": reports/2025/index.md
    - "2026":
      - Overview: reports/2026/index.md
      - "Sustainability and ESG Reporting Frameworks": reports/2026/6-esg-reporting-frameworks.md
      - "Due Diligence in Corporate Sustainability": reports/2026/due-diligence-in-6-stappen-nl-sep2021.md
      - "ESG Business Handbook": reports/2026/esg-business-handbook.md
      - "DigComp 3.0 - European Digital Competence Framework": reports/2026/jrc144121_01.md
      - "Voluntary Sustainability Reporting for SMEs": reports/2026/webinar-vsme---marlou-duchateau-en-esther-roelofsen.md
  - Models:
    - Semantic Model: models/semantic-model.md
    - Concept Map: models/concept-map.md
    - Ontology: models/ontology.md
    - Cross-Reference Matrix: cross-reference-matrix.md
  - Glossary: glossary.md
