name: Build & Deploy Wiki

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history so git-revision-date-localized dates each page

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The pipeline lives in the sibling kb-framework repo; clone it to ../kb-framework
      # so `framework_path: ../kb-framework` (config/kb.yaml) resolves in CI.
      - name: Check out kb-framework (sibling path)
        run: git clone --depth 1 https://github.com/hvroosmalen-eaxpertise/kb-framework.git ../kb-framework

      # Deterministic lint gate: fails on ORPHAN/STALE findings (see lint: in config/kb.yaml).
      # Mirrors the strict build's link gate, but for semantic integrity.
      - name: Lint (deterministic gate)
        run: python ../kb-framework/pipeline/lint.py --kb .

      # --strict turns unresolved [[wikilinks]] and other warnings into errors,
      # so a broken cross-reference fails the build instead of shipping silently.
      - name: Build (strict)
        run: python -m mkdocs build --config-file mkdocs.yml --strict

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    # Only deploy on push to master; pull requests just run the strict build above.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
